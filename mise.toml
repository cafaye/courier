# Toolchain pins for this repository. Elixir and Erlang are pinned here and in
# the Dockerfile, and nowhere else: mix.exs carries a `~>` floor for library
# consumers, not a second exact version.
#
#   mise install        # install the pinned toolchain
#   mise run prime      # the gate: deps, database, tests
[tools]
elixir = "1.20.4-otp-29"
erlang = "29.1.1"

[tasks.prime]
description = "The gate: install hex, fetch deps, set up the database, run the tests"
run = "./bin/prime"

[tasks.server]
description = "Start the Phoenix endpoint on http://localhost:4000"
run = "mix phx.server"
