# courier's HTTP surface, per cafaye/core/docs/openapi-conventions.md.
#
# This file now describes every route courier's router serves except two, and the
# two are named here: `/healthz` and `/readyz` are infrastructure probes that run
# before auth, routing and the rest of the platform exist, and no customer codes
# against them. A document that claims to describe courier and quietly omits part
# of it is worse than one that says what it covers — which is why the omissions
# are declared in this header *and* enforced by
# `test/courier_web/openapi_document_test.exs`, which fails if this file and
# `lib/courier_web/router.ex` disagree in either direction.
#
# `GET` and `PUT /v1/notification_preferences/{user_id}` were in the router with
# tests behind them and absent from here, which is the drift this file's check now
# prevents from recurring. They are the other half of the public surface, not an
# afterthought, and they are documented as thoroughly as the webhooks.
#
# > **Every operation in this document is authenticated**, including the two
# > notification-preferences operations, which is not how this file used to read.
# > They were served with `security: []` and a `> DECISION NEEDED (courier-05)`
# > above this line recording the gap, on the measured argument that closing it
# > later would be a major `info.version` and a regenerated SDK for anyone who
# > had integrated against `security: []`. That argument was right about the cost
# > and wrong about the deadline, and the cost is paid now: `info.version` is
# > **2.0.0**, a client generated from the previous document sends no token and
# > receives a `401`. There is no 2.x client yet, which is the only reason this is
# > the cheap moment rather than a breaking change to somebody's build.
#
# The three answers on those two operations are the same three the webhooks give,
# because they go through the same plug and are decided in the same context:
#
#   * **anonymous → 401**, from `CourierWeb.Plugs.Principal`, whose default
#     resolver authenticates nobody — so a courier deployed without identity's JWT
#     verifier locks these routes rather than serving them.
#   * **another account → 404**, for a user whose stored preferences belong to
#     somebody else. Not a 403: core's conventions forbid a 403 that leaks the
#     existence of a resource the caller cannot see.
#   * **a user nobody has written preferences for → 200**, with the defaults. The
#     404 above is deliberately narrow — courier holds no foreign key to identity's
#     users, so with no stored rows it knows nothing about the user, and a 404
#     would be courier claiming to know something about the requester it does not
#     know.
#
# **A user's preferences belong to an account, and the account is recorded rather
# than asked for.** `notification_preferences.account_id` is written from the
# principal, never from a request, and the unique index stays on
# `(user_id, notification_type)` — a user has one set of preferences, not one per
# account, so the account is the row's owner rather than part of its identity.
# The consequence a caller can observe: the **first** authenticated `PUT` for a
# user id is what records the owning account, because courier cannot ask identity
# which account a user belongs to. An account that writes for an unwritten user id
# claims that user and gets no access to anything that existed.
#
# ## What courier does not return, and why that is written down here
#
# A document that omits a reachable response is worse than one that says what it
# covers, so the omissions are declared rather than left to be found. Each of the
# following was measured against this repository's endpoint rather than read off
# it, and each is the reason no operation below declares it:
#
#   * **403 `forbidden`** — nothing sends it. `CourierWeb.Plugs.Principal`
#     answers 401 for an anonymous caller and nothing else, and a resource in
#     another account is a 404, because core forbids a 403 that leaks existence.
#   * **409 on a duplicate `url`** — a duplicate `url` is a **422** whose
#     `errors[0].code` is `taken`, which is the status convention's
#     "semantically wrong", not a conflict. The 409s that *are* declared are for
#     `Idempotency-Key` and for `sendMessage`, below.
#   * **415 `unsupported_media_type`** — the parser is configured
#     `pass: ["*/*"]`, so an unknown content type is neither parsed nor refused.
#     The request reaches the controller and is answered 422 for the field it did
#     not carry.
#   * **429 `rate_limited`** — there is no limiter. Thirty rapid reads answer
#     thirty 200s and thirty rapid writes answer thirty 201s.
#
# ## 503 `unavailable` is declared now, and this line is what changed
#
# It used to sit in the list above with the note "only `GET /readyz` sends it",
# which was true and is no longer. `sendMessage` has a dependency courier does not
# control — an SMTP relay — and a send has to be able to say so:
#
#   * **the provider refused.** A 4xx or 5xx from the relay, a refused credential,
#     a socket that would not open. Nothing was sent, no outbox row was written,
#     and the retry is safe.
#   * **courier cannot deliver at all.** `COURIER_MAIL_ADAPTER` names an adapter
#     that never opens a socket, or names none. This is the same predicate
#     `Courier.MailerAdapter` checks at boot, asked a third time per request — not
#     because the boot gate is insufficient, but because **the refusal has to be
#     visible to the caller**. A courier that booted with a silent adapter would
#     otherwise answer 200, write an outbox row and publish
#     `courier.email.delivered` for mail nobody receives, which is the whole
#     failure the adapter work exists to end.
#
# It is 503 and not 500 because courier is fine and its dependency is not, and that
# is the difference between a generated client retrying and a generated client
# filing a bug against courier. `GET /readyz` still sends it, and still is not an
# operation in this document.
#
# ## Idempotency-Key, and what each of the three answers means
#
# All three mutating `POST`s accept `Idempotency-Key`, as core's conventions
# require of a POST that can be retried safely. `createWebhookEndpoint` registers a
# destination that will receive at-least-once deliveries, and a caller that timed
# out on it has no other way to learn whether the first attempt landed. `sendMessage`
# is the strongest case of the three: a send is not idempotent by HTTP's definition,
# so a caller that timed out and retried without the header **mails somebody twice**,
# and there is no way for courier to tell the two messages apart afterwards.
#
# courier-12 measured that courier did **not** implement this, and said so here
# rather than declaring a contract for behaviour that was not there. That gap is
# closed as of courier-14, and this section is rewritten rather than deleted, so
# the reader can see that the header was once accepted and ignored and is now the
# mechanism the 409s below exist for.
#
#   * **Same key, same body, already answered** — the stored response, byte for
#     byte, with `Idempotency-Replayed: true`. For `createWebhookEndpoint` that
#     response carries the signing secret, which exists in exactly one 201 and
#     cannot be re-derived, so a client that lost the first response to a timeout
#     gets the secret back from its retry.
#   * **Same key, different body** — 409 `idempotency_key_reused`.
#   * **Same key, same body, first attempt still running** — 409 `conflict`.
#     Core's five sentences do not describe the concurrent case, and this is
#     courier's answer: not `idempotency_key_reused`, because the bodies are
#     identical and saying otherwise is a lie a retry loop is built on, and not a
#     503, because nothing is unavailable. `conflict` is core's own word for a
#     request that collides with current state.
#
# Three things the header does **not** do, each measured rather than assumed:
#
#   * **A request with no key is processed normally** and records nothing. A
#     retry without a key is the client's bug, and it is answered as though the
#     key were absent.
#   * **Only a 2xx is stored.** A 4xx leaves the key free immediately, so a
#     client that fixed its request and retried with the same key gets its new
#     answer rather than a 409 about a key it never reused; a 5xx leaves it free
#     too, so a transient courier failure is not pinned for a day.
#   * **A key that is not a uuid is a 422.** courier-12 measured that a non-uuid
#     and a 5000-character key were both accepted without complaint; the second
#     of those was a string in a unique index, paid for by every write.
#
# Retention is 24 hours, scoped to the `(account, endpoint, key)` triple with
# `endpoint` the concrete path. REPORT-courier-14-coreversion.md has the
# measurements, including the two Elixir behaviours that had to be discovered the
# hard way and are now written into the code that depends on them.
#
# ## Two other facts about this surface, because a reader is owed them
#
#   * **`?order=` and `?offset=` are accepted and ignored.** Core's standard
#     request shape is `?limit=&cursor=&order=asc|desc`; courier paginates
#     oldest-first only, so a request carrying `order` is answered as if it were
#     not there, and `offset` is ignored for the reason core gives for banning it.
#     Neither is declared below, because neither is honoured.
#   * **`limit` is capped silently.** `?limit=99999` is a 200 answering with at
#     most 100 rows, not a 422. The cap is real and is stated in the parameter;
#     what a client cannot see from here is that it was applied.
#
# ## Why `400` is on some operations and not others
#
# `CourierWeb.Plugs.ParseBody` wraps `Plug.Parsers`, and that reads a request body
# for `POST`, `PUT`, `PATCH` and `DELETE` — and for no other verb. So the 400 is
# reachable on exactly the four operations above that carry one of those verbs,
# which is not the same as "every operation that takes input": `GET` sends no body
# and is refused by neither the parser nor anything else, and a `400` declared on a
# `GET` is a case a client writes and can never run.
#
# `DELETE` is the one that reads wrong. A `DELETE` carries no body in any sensible
# client, so it looks bodyless, and a document that omits its 400 looks right —
# until a client that does send one is answered with a body nobody documented. It
# is declared for that reason, and
# `test/courier_web/openapi_error_responses_test.exs` checks the agreement in both
# directions so neither half can drift back.
openapi: 3.1.0

info:
  # The document's own semantic version, which moves with the document and not
  # with the `/v1` prefix. The prefix changes only on a breaking change, and then
  # this number changes in the same commit.
  #
  # This is a **major** bump and the first one this document has taken, so the
  # reason is stated rather than implied by the number. No path changed, no
  # operation was added or removed, and no response body changed shape — but
  # `GET` and `PUT /v1/notification_preferences/{user_id}` went from `security:
  # []` to requiring a bearer token, which is a change to what a client has to
  # send and therefore a breaking change to the contract rather than an additive
  # one. A client generated from 1.4.0 sends no token and receives a 401.
  #
  # The previous bump (1.3.0 → 1.4.0, courier-14) was a minor one for the
  # opposite reason: `Idempotency-Key` and the two 409s it can now answer describe
  # what courier began doing, and a client that sends no key is unaffected.
  #
  # The bump to 2.1.0 is minor, and it is the additive kind core's conventions
  # describe: one new operation (`POST /v1/messages`) and no change to any
  # existing path, verb, request field or response shape. A client generated from
  # 2.0.0 keeps working against it, which is what makes it minor.
  version: 2.1.0
  title: caFaye courier
  description: |
    Transactional email, notification preferences, and outbound webhooks.

    courier delivers events to customer HTTP endpoints using the
    [Standard Webhooks](https://www.standardwebhooks.com) signature scheme, so a
    delivery is verified with an official library and nothing has to be written
    about courier's scheme.
  contact:
    name: courier
    email: courier@cafaye.com
  license:
    name: MIT
    identifier: MIT
    url: https://opensource.org/license/mit

servers:
  - url: https://courier.cafaye.com
    description: production
  - url: http://localhost:4000
    description: local

tags:
  - name: webhook endpoints
    description: |
      Where an account registers the URLs courier delivers events to, and the
      signing secrets those deliveries are signed with.
  - name: notification preferences
    description: |
      What a user has been asked to receive, per notification type and per channel.
      Silence is not consent: a user courier has never seen, or a type a user has
      never mentioned, is on.
  - name: messages
    description: |
      courier's send path, over HTTP. One operation, and it is the only door into
      it — everything else in this service reads or configures what a send will
      do rather than causing one.

security:
  - bearerAuth: []

paths:
  /v1/messages:
    post:
      tags: [messages]
      operationId: sendMessage
      summary: Send one transactional message
      security:
        - bearerAuth: [messages:write]
      description: |
        Sends one of courier's transactional messages and answers with what
        happened. This is the operation the platform's password reset, email
        verification, email change and team invitation flows call; until it
        existed those endpoints were reachable-looking and none of them could
        complete.

        ## What a 200 means, precisely

        **The provider accepted the message for delivery, and courier wrote the
        `courier.email.delivered` outbox row in the same transaction.** It does
        **not** mean the mail arrived. A submission protocol's whole reply is
        "accepted for delivery"; courier has no delivery receipt and will not
        imply one it does not hold. `data.status` therefore reads `accepted` and
        never `delivered` — a field reading `delivered` would be courier claiming
        a fact about somebody else's inbox that courier cannot know yet.

        The send is **synchronous**: the preference check, the suppression check,
        the provider's dial and the outbox row all happen inside the request, so
        this response is the real outcome rather than a receipt for an intention.
        The consequence is that a 409 below is a refusal the caller can act on,
        which a queued contract could not give them — the answer would arrive after
        the response, and a caller who cannot tell "suppressed" from "sent" retries
        forever.

        ## Three refusals, told apart by status and `code`

        A client branches on `code` and not on `detail`, so the three outcomes
        below are distinguishable without parsing prose:

        | outcome | status | `code` | retry? |
        | --- | --- | --- | --- |
        | accepted for delivery | 200 | — | — |
        | the recipient's mailbox is suppressed | 409 | `conflict` | **no** |
        | the request is wrong, or the user declined this type | 422 | `validation_failed` | after fixing it |
        | the provider refused, or courier cannot deliver | 503 | `unavailable` | yes, same key |

        **A suppressed mailbox is a 409, not a 422**, and the reason is that it is
        not a property of the request. A hard bounce and a spam complaint are
        facts about a *mailbox*, recorded by a provider and not chosen by this
        caller, and courier's suppression list is not exposed through any route —
        so this response is the only place the fact can surface. 409 `conflict` is
        core's own code for a request colliding with the current state of a
        resource, and it is the status that tells a generated client not to try
        again. A 422 would tell the caller to change a request that cannot be
        changed.

        **A declined preference is a 422**, the opposite answer on purpose. The
        user declining is visible through `GET /v1/notification_preferences/{user_id}`,
        it is changeable through the `PUT` beside it, and `errors[]` — which core
        reserves for 422 and nothing else — can name `type` as the field at
        fault.

        **A provider refusal is a 503 and not a 500**, because courier is fine and
        its dependency is not. Nothing was sent and no row was written, so the
        retry is safe; and a failed request **releases** its `Idempotency-Key`
        rather than storing the failure, so a retry is not locked out for 24 hours.

        ## Authentication

        Required, and not as a formality: an unauthenticated `POST` to a mail
        egress is an open relay, and it is the one surface where that would be
        true rather than theoretical. courier does not guess an account for an
        anonymous caller, and a deployment without identity's JWT verifier locks
        this route rather than serving it. The account comes from the principal
        and **never from the body** — a body carrying `account_id` is a 422 naming
        that field.

        ## Why there is no `from`, and no `text`/`html`

        Both are deliberate refusals of the obvious design, and the argument is
        the same: courier sends *transactional* mail it renders from its own
        templates, and a caller that could choose the sender would be a phishing
        relay wearing the platform's sending domain — a cost borne by every other
        tenant. So the sender and the subjects are configuration
        (`COURIER_MAIL_*`), a body carrying `from` is a 422, and the bodies come
        from templates keyed on `type`. What remains of "at least one of
        text/html" is a check on the **rendered** message rather than on the
        request: courier refuses to send a message with neither body, because
        `Swoosh` would accept it and answer a provider-shaped id, and a bodiless
        mail reported as delivered is the exact silent default this service has
        spent two packets refusing.

        ## Idempotency

        Send `Idempotency-Key` and a retry with the same key and the same body
        returns the first response byte for byte with `Idempotency-Replayed:
        true`, having sent **one** mail. Omit it and a retry sends a second mail:
        a send is not idempotent by HTTP's definition, and that is the caller's
        own problem rather than something courier hides. The header is documented
        here because silence about it would be the worse answer.

        ## What a caller cannot see

        The suppression list is never exposed through a route. A 409 says a
        mailbox cannot be written to and does **not** echo the address back, and
        `email_suppressions` carries no `account_id` — so the refusal is a fact
        about a mailbox rather than about another tenant's data, and it is the
        same posture the send path takes when it answers "no mail went out" rather
        than "here is a list".
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            examples:
              welcome:
                summary: A welcome message
                value:
                  type: welcome
                  user_id: 6f5d4c3b-2a19-4e8f-9c07-1b2d3e4f5061
                  to: kaka@example.com
                  name: Kaka
              password_reset:
                summary: A password reset, which needs a link
                value:
                  type: password_reset
                  user_id: 6f5d4c3b-2a19-4e8f-9c07-1b2d3e4f5061
                  to: kaka@example.com
                  url: https://cafaye.com/reset?token=6f5d4c3b
      responses:
        '200':
          description: The provider accepted the message for delivery
          headers:
            Idempotency-Replayed:
              $ref: '#/components/parameters/IdempotencyReplayed'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SendMessageResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '409': { $ref: '#/components/responses/MessageSuppressed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/notification_preferences/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'

    get:
      tags: [notification preferences]
      operationId: getNotificationPreferences
      summary: What this user has been asked to receive
      security:
        - bearerAuth: [notifications:read]
      description: |
        Every notification type courier sends, with this user's stored answers
        filled in and the defaults used where there are none. A `GET` never writes.

        **An unwritten user is a 200, not a 404.** identity owns the user table.
        courier is asked about a user id and answers with that user's
        preferences, which for a user who has never touched the settings is
        three types, all on. A 404 would be courier claiming to know something
        about the requester it does not know.

        **A user whose preferences belong to another account is a 404**, and
        that is the one case where the previous sentence does not apply: there is
        a resource, it is not the caller's, and a 403 would confirm it exists.
        The 404 appears only once somebody has written preferences for that user
        id — see this document's header for why the account is recorded rather
        than asked of identity, and what that means for who owns an unwritten
        user id.
      responses:
        '200':
          description: Every notification type, with this user's answers
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/NotificationPreferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotificationPreferencesNotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/Internal' }

    put:
      tags: [notification preferences]
      operationId: updateNotificationPreferences
      summary: Apply a batch of preferences
      security:
        - bearerAuth: [notifications:write]
      description: |
        Stores a batch and answers with the state the user now has — the same
        shape a `GET` returns, so a settings page does not have to follow a write
        with a read to render.

        **A rejected batch writes nothing.** The entries are validated together
        before any of them is stored, so a typo in the third entry cannot leave
        the first two applied and the user looking at a half-saved settings page.
        Applying the same batch twice is the same answer: this operation is
        idempotent by construction, because it stores the state it is given rather
        than accumulating deltas.

        `user_id` comes from the path and is never read from the body. A body
        that names a different user cannot write that user's preferences.

        `account_id` cannot be named by a request at all: it is not a field of a
        preference entry, so an entry carrying one is a 422 naming
        `preferences[0].account_id`, and one beside the batch names nothing this
        operation reads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferences]
              properties:
                preferences:
                  type: array
                  minItems: 1
                  description: |
                    The entries to store. A type or channel not named here is left
                    alone, so a client that knows about one setting can send one
                    entry without overwriting the rest.
                  items:
                    type: object
                    required: [notification_type]
                    properties:
                      notification_type:
                        $ref: '#/components/schemas/NotificationType'
                      email_enabled:
                        type: boolean
                        default: true
                      push_enabled:
                        type: boolean
                        default: true
                        description: |
                          Stored and returned because the API is the user's
                          settings, but nothing sends push, so a `true` here does
                          not mean courier will send a push.
            examples:
              - preferences:
                  - notification_type: welcome
                    email_enabled: false
      responses:
        '200':
          description: The stored state, the same shape a `GET` returns
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/NotificationPreferences' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotificationPreferencesNotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/Internal' }

  /v1/webhook_endpoints:
    get:
      tags: [webhook endpoints]
      operationId: listWebhookEndpoints
      summary: List the caller's webhook endpoints
      description: |
        Cursor-paginated, oldest first. Disabled endpoints are included:
        disabling is not deleting, and the row carries the failure count and the
        reason delivery stopped.
      security:
        - bearerAuth: [webhooks:read]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of endpoints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/Internal' }

    post:
      tags: [webhook endpoints]
      operationId: createWebhookEndpoint
      summary: Register a webhook endpoint
      description: |
        The signing secret is returned **once**, in this response, and cannot be
        retrieved afterwards. Store it before leaving the response. A url courier
        will not send to is refused with a 422 whose `errors[0].code` names the
        class — `blocked_scheme`, `blocked_host`, `blocked_address`,
        `dns_failure` — because a well-formed url that resolves to a private
        address is a different problem from a typo and the customer needs to be
        told which one they have.
      security:
        - bearerAuth: [webhooks:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 2048
                  description: |
                    An absolute http(s) URL. `file:`, `ftp:`, `gopher:`, `data:`
                    and `javascript:` are refused, as are loopback, link-local
                    (including `169.254.169.254`), RFC1918 and unique-local
                    addresses — by literal address *and* by what the host
                    resolves to.
                  examples:
                    - https://hooks.example.com/cafaye
                description:
                  type: string
                  maxLength: 500
                  nullable: true
      responses:
        '201':
          description: Registered, with the signing secret
          headers:
            Idempotency-Replayed:
              $ref: '#/components/parameters/IdempotencyReplayed'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/WebhookEndpoint'
                      - type: object
                        required: [secret]
                        properties:
                          secret:
                            type: string
                            pattern: '^whsec_[A-Za-z0-9+/]+=*$'
                            description: |
                              The Standard Webhooks signing secret, base64
                              encoded behind the `whsec_` prefix. Shown once.

                              This field deliberately carries NO example value.
                              A secret of this kind is not usefully
                              exemplified — the only real one a caller will
                              ever see is the one this response hands back,
                              and a made-up example in a public specification
                              costs more than it teaches: GitHub's secret
                              scanning matches the `whsec_`-plus-base64 SHAPE
                              rather than the content, this repository is
                              public, and every realistic example value pushed
                              here opened an alert that somebody then had to
                              resolve. Five were opened on 2026-10-01 and all
                              five were documentation or test fixtures.

                              The `pattern` above is the machine-readable
                              contract: `whsec_`, then base64. A conforming
                              secret is 32 random bytes, so it base64-decodes
                              to nothing readable — which is also the quick
                              way to tell a real one from a fixture. The
                              third-party test vector in
                              `test/courier/inbound/signature_test.exs` is
                              svix's own published worked example and is the
                              one intentional literal in this repository; it
                              pins signature verification against a party
                              other than this repository and should not be
                              removed to satisfy a scanner. An alert on any
                              other `whsec_` value that decodes to nothing
                              readable is a real one: stop, rotate, and
                              investigate.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '409':
          description: >-
            The `Idempotency-Key` was reused with a different body, or its first
            request is still in flight. The two are distinguished by `code`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                reused:
                  summary: Same key, different body
                  value:
                    type: https://errors.cafaye.com/idempotency_key_reused
                    title: Idempotency key reused
                    status: 409
                    detail: That Idempotency-Key was already used for a different request body.
                    code: idempotency_key_reused
                    trace_id: 0af7651916cd43dd8448eb211c80319c
                in_flight:
                  summary: Same key, first request still running
                  value:
                    type: https://errors.cafaye.com/conflict
                    title: Conflict
                    status: 409
                    detail: That Idempotency-Key is still being processed.
                    code: conflict
                    trace_id: 0af7651916cd43dd8448eb211c80319c
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/Internal' }

  /v1/webhook_endpoints/{id}:
    parameters:
      - $ref: '#/components/parameters/EndpointId'

    get:
      tags: [webhook endpoints]
      operationId: getWebhookEndpoint
      summary: Fetch one webhook endpoint
      security:
        - bearerAuth: [webhooks:read]
      responses:
        '200':
          description: The endpoint
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/WebhookEndpoint' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '500': { $ref: '#/components/responses/Internal' }

    patch:
      tags: [webhook endpoints]
      operationId: updateWebhookEndpoint
      summary: Change a webhook endpoint
      description: |
        A new `url` is a new destination and passes the same checks as a create.
        Fields that are not named are left alone, and the signing secret never
        changes here: a customer who edits a description must not have every
        delivery start failing verification for a day.
      security:
        - bearerAuth: [webhooks:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 2048
                description:
                  type: string
                  maxLength: 500
                  nullable: true
                status:
                  $ref: '#/components/schemas/WebhookEndpointStatus'
      responses:
        '200':
          description: The endpoint as it now is
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/WebhookEndpoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/Internal' }

    delete:
      tags: [webhook endpoints]
      operationId: deleteWebhookEndpoint
      summary: Remove a webhook endpoint
      security:
        - bearerAuth: [webhooks:write]
      responses:
        '204':
          description: Removed. No body.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '500': { $ref: '#/components/responses/Internal' }

  /v1/webhook_endpoints/{id}/test:
    parameters:
      - $ref: '#/components/parameters/EndpointId'

    post:
      tags: [webhook endpoints]
      operationId: testWebhookEndpoint
      summary: Send a signed test payload to the endpoint
      description: |
        Sends a signed `ping` and reports what the receiver answered. The response
        is `200` whether or not the endpoint accepted it: the caller's request
        was well-formed and courier did what it was asked, which is a different
        fact from courier being unable to test. Read `data.delivered`.

        This is not a delivery. It writes no `webhook_deliveries` row, counts no
        attempt, and does not move the endpoint's circuit breaker — a customer
        testing their own endpoint and getting a 500 has learned something true,
        and charging their circuit for asking would punish them for using the
        diagnostic.

        `Idempotency-Key` applies here too, and it matters more than it looks: a
        retried ping with the same key is answered from the stored response, so
        the customer's endpoint receives **one** signed request rather than two. A
        test endpoint that receives duplicates is a support question.
      security:
        - bearerAuth: [webhooks:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The ping was sent; `delivered` says whether it was accepted
          headers:
            Idempotency-Replayed:
              $ref: '#/components/parameters/IdempotencyReplayed'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [delivered, status_code, duration_ms]
                    properties:
                      delivered:
                        type: boolean
                        description: Whether the receiver answered 2xx.
                      status_code:
                        type: integer
                        nullable: true
                        description: The receiver's status, or null if nothing answered.
                      duration_ms:
                        type: integer
                        description: How long the attempt took.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '409':
          description: >-
            The `Idempotency-Key` was reused with a different body, or its first
            request is still in flight. The two are distinguished by `code`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                reused:
                  summary: Same key, different body
                  value:
                    type: https://errors.cafaye.com/idempotency_key_reused
                    title: Idempotency key reused
                    status: 409
                    detail: That Idempotency-Key was already used for a different request body.
                    code: idempotency_key_reused
                    trace_id: 0af7651916cd43dd8448eb211c80319c
                in_flight:
                  summary: Same key, first request still running
                  value:
                    type: https://errors.cafaye.com/conflict
                    title: Conflict
                    status: 409
                    detail: That Idempotency-Key is still being processed.
                    code: conflict
                    trace_id: 0af7651916cd43dd8448eb211c80319c
        '500': { $ref: '#/components/responses/Internal' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        identity is the only issuer. The token carries `account_id` for tenancy
        and `scopes` for capability; courier checks both and never reads a role
        out of a claim, because core's conventions say a service asks identity
        about roles and checks scopes itself.

  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      description: |
        A uuid from identity. courier does not own users and holds no foreign key
        to them, so this is checked for *shape* and nothing else: a non-uuid is a
        422 before the body is looked at, and a well-formed id courier has never
        seen is a 200 with the defaults.
      schema: { type: string, format: uuid }

    EndpointId:
      name: id
      in: path
      required: true
      description: The endpoint's uuid.
      schema: { type: string, format: uuid }

    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Defaults to 25, capped at 100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        The opaque cursor from a previous page's `page.next_cursor`. Clients must
        not parse it; courier's encoding may change without notice. A cursor
        courier did not issue is a 422.
      schema: { type: string }

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A uuid the client chooses, which makes a retry of this request free.

        Send it, and a retry with the **same** key and the **same** body returns
        the first response byte for byte with `Idempotency-Replayed: true` — for
        `createWebhookEndpoint` that includes the signing secret, which exists in
        exactly one response and cannot be re-derived. Without it a caller that
        timed out cannot know whether the first attempt landed, and retrying a
        webhook registration produces a second destination courier will sign for.

        Three cases, and a client can tell them apart by `code`:

        | you sent | you get | `code` |
        | --- | --- | --- |
        | same key, same body, already answered | the first response, with `Idempotency-Replayed: true` | — |
        | same key, different body | 409 | `idempotency_key_reused` |
        | same key, same body, first attempt still running | 409 | `conflict`; retry the same request shortly |

        Omitting the header is not an error: the request is processed normally,
        and a retry without a key is the client's own problem. A key that is not a
        uuid is a 422 — the header is a uuid because an unbounded string in a
        unique index is a cost every write pays.

        The key is scoped to the `(account, endpoint, key)` triple, and `endpoint`
        is the **concrete** path, so the same key used to test two different
        endpoints is two different keys. Retention is 24 hours, after which the
        key behaves as though it had never been used. Only a 2xx is stored, so a
        request that failed leaves the key free to use again immediately.
      schema: { type: string, format: uuid }

    IdempotencyReplayed:
      name: Idempotency-Replayed
      in: header
      required: false
      description: |
        `true`, and **only** on a response that is a stored replay of an earlier
        request rather than the answer to the one in front of courier. A client
        that receives it knows the mutation happened exactly once. Absent on every
        first response, and absent on every request sent without a key.
      schema:
        type: string
        enum:
          - 'true'

  schemas:
    SendMessageRequest:
      type: object
      required: [type, user_id, to]
      description: |
        What to send, to whom, and who it is about.

        **The vocabulary is closed.** An unknown field is a 422 naming it, rather
        than a field courier silently discards — a misspelled `emai_enabled` that
        was ignored would leave a caller believing a setting had taken effect.
        `account_id` is in that set: the account is the principal's and never the
        body's.
      additionalProperties: false
      properties:
        type:
          $ref: '#/components/schemas/NotificationType'
        user_id:
          type: string
          format: uuid
          description: |
            The user this send is about, and the key the recipient's preferences
            are read by. Checked for shape only — courier holds no foreign key to
            identity's users. A non-uuid is a 422: it could key no preference and
            attribute no event.
        to:
          type: string
          format: email
          description: |
            The recipient. courier's payload calls this field `email` because that
            is what the platform's event payloads carry; over HTTP it is `to`,
            which is the mail vocabulary.

            This address is checked against courier's suppression list before
            anything is sent, so a mailbox that hard-bounced or reported a previous
            message as spam is a **409 `conflict`** — see the operation.
        name:
          type: string
          nullable: true
          maxLength: 255
          description: |
            The recipient's display name, used in the greeting. Optional; courier
            falls back to a bare greeting when it is absent.
        url:
          type: string
          format: uri
          maxLength: 2048
          description: |
            The link the message carries — the reset link, the invitation link,
            the confirmation link. Required by `password_reset` and
            `team_invitation` and unused by `welcome`, which is why its absence is
            a 422 naming `url` rather than a silently linkless mail.
        account_name:
          type: string
          maxLength: 255
          description: Required by `team_invitation` only.
        invited_by:
          type: string
          maxLength: 255
          description: Required by `team_invitation` only.
        role:
          type: string
          maxLength: 255
          description: |
            The role offered by a `team_invitation`. Optional and unvalidated
            against any list — courier has no role vocabulary of its own, and
            inventing one would put a second source of truth next to identity's.

    SendMessageResult:
      type: object
      required: [message_id, event_id, notification_type, user_id, status]
      properties:
        message_id:
          type: string
          description: |
            courier's id for this message, and the one on the wire as the
            `Message-ID` header. A bounce or a complaint quoting it can be tied
            back to this send, which is the entire reason it is returned.
        event_id:
          type: string
          format: uuid
          description: |
            The `courier.email.delivered` outbox row written in the same
            transaction as the send, so a caller can correlate its own send with
            the event every subscriber on the bus sees.
        notification_type:
          $ref: '#/components/schemas/NotificationType'
        user_id:
          type: string
          format: uuid
          description: The user this send was about, as the body named them.
        status:
          type: string
          enum: [accepted]
          description: |
            Always `accepted`, and never `delivered`. A submission protocol's whole
            reply is "accepted for delivery"; courier has no delivery receipt and
            will not imply one it does not hold. A client that needs to know the
            mail arrived has to wait for the bounce, not read this field.

    NotificationType:
      type: string
      enum: [welcome, password_reset, team_invitation]
      description: |
        Every notification type courier sends. A type outside this list is a 422
        naming `preferences[0].notification_type`, because a preference for
        something courier will never send is a setting page that lies to the user.

    NotificationPreference:
      type: object
      required: [notification_type, email_enabled, push_enabled]
      properties:
        notification_type: { $ref: '#/components/schemas/NotificationType' }
        email_enabled:
          type: boolean
          description: |
            Whether courier will send this type to this user by email. Defaults
            to true: silence is not consent.
        push_enabled:
          type: boolean
          description: |
            Stored and returned so the answer is complete, but nothing sends push
            — a `true` here does not mean courier will send a push.

    NotificationPreferences:
      type: object
      required: [user_id, preferences]
      properties:
        user_id:
          type: string
          format: uuid
          description: The user these preferences are for, as the path named them.
        preferences:
          type: array
          description: |
            Every notification type, always all of them and never a subset: a
            settings page should not have to guess what it has not been told.
          items: { $ref: '#/components/schemas/NotificationPreference' }

    WebhookEndpointStatus:
      type: string
      enum: [enabled, disabled]
      description: |
        `disabled` is two things wearing one column: the customer turned it off,
        or courier's circuit breaker tripped. `disabled_reason` tells them apart,
        and is courier's to clear.

    WebhookEndpoint:
      type: object
      required: [id, account_id, url, status, consecutive_failures]
      properties:
        id: { type: string, format: uuid }
        account_id:
          type: string
          format: uuid
          description: The owning account. Always the caller's.
        url: { type: string, format: uri, maxLength: 2048 }
        description: { type: string, nullable: true, maxLength: 500 }
        status: { $ref: '#/components/schemas/WebhookEndpointStatus' }
        consecutive_failures:
          type: integer
          description: |
            Failures since the last success. At the circuit threshold courier
            disables the endpoint and records why.
        disabled_reason:
          type: string
          nullable: true
          description: |
            Why delivery stopped, when courier is the one who stopped it. Null for
            an endpoint the customer disabled, and null again once they re-enable
            one courier had tripped.

    WebhookEndpointPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/WebhookEndpoint' }
        page:
          type: object
          required: [has_more, next_cursor]
          properties:
            has_more: { type: boolean }
            next_cursor:
              type: string
              nullable: true
              description: Null on the last page.

    Problem:
      type: object
      description: RFC 9457, with courier's extensions. Every non-2xx.
      required: [type, title, status, detail, code, trace_id]
      properties:
        type:
          type: string
          format: uri
          description: '`https://errors.cafaye.com/<code>`. The machine-readable contract.'
        title: { type: string }
        status: { type: integer }
        detail:
          type: string
          description: Specific to this occurrence. Not parsed by clients.
        instance:
          type: string
          nullable: true
          description: The path the request was made to.
        code:
          type: string
          description: The last segment of `type`, in snake_case.
        trace_id:
          type: string
          description: Matches the `X-Trace-Id` response header. Support starts here.
        errors:
          type: array
          description: Present only on a 422.
          items:
            type: object
            required: [field, code]
            properties:
              field:
                type: string
                description: The path in the *request*, which is what the caller can fix.
              code:
                type: string
                # Additive. `unknown_field`, `required` and
                # `unknown_notification_type` are `sendMessage`'s, and each earns
                # its place: `CourierWeb.Messages` has a closed vocabulary, so a
                # key courier does not read (`account_id`, a misspelled
                # `emai_enabled`) is a refusal the caller can act on rather than a
                # field silently discarded — and a client that switches on `code`
                # needs to tell "you sent me a field I do not have" from "the value
                # in a field I do have is wrong".
                #
                # `notification_preferences_disabled` is the one code here that is
                # not about syntax at all, and it is here rather than nowhere
                # because `errors[]` is core's only machine-readable extension and
                # a declined preference is a per-field refusal a client has to be
                # able to act on. The alternative was a 409 indistinguishable from
                # a suppressed mailbox, which is worse: two different remedies
                # behind one code.
                enum: [invalid_format, taken, blocked_scheme, blocked_host, blocked_address, dns_failure, unknown_field, required, unknown_notification_type, notification_preferences_disabled]
              detail:
                type: string
                description: |
                  Why this one field was refused, when courier has something to add
                  to `code` — a bad `limit` reads "is not a positive integer"
                  rather than only `invalid_format`. Present on some entries and
                  not on others, so a client must not require it.

  responses:
    BadRequest:
      description: |
        The body was not the shape courier was sent. This is 400 and not 422
        because a client could not have known: the request never parsed, so
        there is no field to name and nothing to correct.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://errors.cafaye.com/bad_request
            title: Bad request
            status: 400
            detail: The request body was not valid JSON.
            code: bad_request
            trace_id: 0af7651916cd43dd8448eb211c80319c

    NotAcceptable:
      description: |
        The request's `Accept` header does not include `application/json`, so
        Phoenix's `:accepts` plug refused to route it. This is the client naming a
        media type courier cannot answer, and courier says so with
        `not_acceptable` rather than with `internal`: an earlier version of courier
        fell through to the `:internal` default here and reported a client that had
        asked for `text/html` as courier having failed, which is the one code every
        generated client retries. Reachable on every operation in this document.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://errors.cafaye.com/not_acceptable
            title: Not acceptable
            status: 406
            detail: courier answers application/json.
            code: not_acceptable
            trace_id: 0af7651916cd43dd8448eb211c80319c

    Unauthorized:
      description: |
        No authenticated caller. courier does not guess an account for an
        anonymous request.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://errors.cafaye.com/unauthorized
            title: Unauthorized
            status: 401
            detail: This request needs an authenticated caller.
            code: unauthorized
            trace_id: 0af7651916cd43dd8448eb211c80319c

    NotFound:
      description: |
        No such endpoint, for this account. An endpoint belonging to another
        account is also a 404: core's conventions forbid a 403 here, because it
        leaks the existence of a resource the caller cannot see.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://errors.cafaye.com/not_found
            title: Not found
            status: 404
            detail: No webhook endpoint with that id.
            code: not_found
            trace_id: 0af7651916cd43dd8448eb211c80319c

    NotificationPreferencesNotFound:
      description: |
        The preferences for this user id exist and belong to another account.

        Not a 403, for the reason the webhook `NotFound` above gives: a 403 would
        tell a caller that this user id has preferences at all, which is the only
        fact this 404 exists to withhold.

        It is deliberately **narrow**. A user nobody has written preferences for is
        a `200` with the defaults on both operations, because courier holds no
        foreign key to identity's users and cannot tell an account's user from one
        that does not exist. This response means "there is something here and it is
        not yours", and only a stored row can make it true.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://errors.cafaye.com/not_found
            title: Not found
            status: 404
            detail: No notification preferences with that user id.
            code: not_found
            trace_id: 0af7651916cd43dd8448eb211c80319c

    IdempotencyKeyReused:
      description: |
        The client sent an `Idempotency-Key` it has already used on this endpoint
        **with a different body**. Core's conventions: "Replay with the same key
        but a different body returns 409 `idempotency_key_reused`."

        A client bug, and the fix is in the request: either send the original body
        again to get the original response, or choose a new key. courier will not
        guess which of the two bodies was intended.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://errors.cafaye.com/idempotency_key_reused
            title: Idempotency key reused
            status: 409
            detail: That Idempotency-Key was already used for a different request body.
            code: idempotency_key_reused
            trace_id: 0af7651916cd43dd8448eb211c80319c

    Conflict:
      description: |
        The client sent an `Idempotency-Key` whose first request on this endpoint
        is **still being processed**, so there is no stored response to replay
        yet. Two requests with one key arriving at the same time is not a retry.

        Not `idempotency_key_reused`: the bodies are identical, and telling a
        client its key was reused with a different body when it was not is the kind
        of lie a retry loop is built on. Retry the same request with the same key
        shortly and the answer will be the original one.

        Core's `openapi-conventions.md` §Idempotency does not describe this case.
        It is courier's, and `conflict` is a code core already reserves at 409.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://errors.cafaye.com/conflict
            title: Conflict
            status: 409
            detail: That Idempotency-Key is still being processed.
            code: conflict
            trace_id: 0af7651916cd43dd8448eb211c80319c

    Internal:
      description: |
        courier failed and the client did nothing wrong. **Every operation in this
        document can answer this one**: it is what `Phoenix.Endpoint.RenderErrors`
        renders for any unhandled raise, including a database that has stopped
        answering. The envelope is courier's and carries the request's
        `trace_id`; the cause is in courier's logs under that id and is not
        repeated to the caller, because these bodies are read by anyone who can
        reach the service.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://errors.cafaye.com/internal
            title: Internal server error
            status: 500
            detail: The request could not be completed.
            code: internal
            trace_id: 0af7651916cd43dd8448eb211c80319c

    MessageSuppressed:
      description: |
        The recipient's mailbox cannot be written to, and courier will not write
        to it. **A 409 and not a 422**, because this is not a property of the
        request: a hard bounce (RFC 5321 §5.1.1, permanent failure) and a spam
        complaint (RFC 2142 §5, an abuse report) are facts about a *mailbox*,
        recorded by a provider and not chosen by the caller. 409 `conflict` is
        core's own code for a request colliding with the current state of a
        resource, and it is the status that tells a generated client **not to
        retry**.

        The suppression list is not exposed through any route, so this response is
        the only place the fact surfaces, and it is shaped accordingly: it does
        **not** echo the address, and it carries no `errors[]`, because core
        reserves that for 422 and this is not a field failure. The two states are
        described in `detail` in words only — an operator's response to each is
        different (a pile of `undeliverable` is list hygiene, a pile of complaints
        is a content and sender-reputation problem), and a machine-readable code
        here would turn this response into the one place a caller could probe the
        list.

        `email_suppressions` carries no `account_id` by design, so this is a fact
        about a mailbox rather than about another tenant's data, and it is the same
        posture the send path takes when it answers "no mail went out" rather than
        "here is a list".
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            undeliverable:
              summary: The mailbox hard-bounced a previous message
              value:
                type: https://errors.cafaye.com/conflict
                title: Conflict
                status: 409
                detail: >-
                  That mailbox does not exist: it hard-bounced a previous message,
                  and courier does not write to a mailbox that has said it is gone.
                code: conflict
                trace_id: 0af7651916cd43dd8448eb211c80319c
            complained:
              summary: The recipient reported a previous message as spam
              value:
                type: https://errors.cafaye.com/conflict
                title: Conflict
                status: 409
                detail: >-
                  That recipient reported a previous message as spam. courier does
                  not write to someone who has asked not to be written to.
                code: conflict
                trace_id: 0af7651916cd43dd8448eb211c80319c

    Unavailable:
      description: |
        The mail provider did not accept the message, or courier is not
        configured to deliver at all. **503 and not 500**, because courier is fine
        and its dependency is not — which is the whole difference between a
        generated client retrying and a generated client filing a bug against
        courier.

        Two causes, and a caller cannot tell them apart and does not need to:

          * **the provider refused** — a relay that returned an error, a credential
            it rejected, a socket that would not open;
          * **courier cannot deliver** — `COURIER_MAIL_ADAPTER` names an adapter
            that never opens a socket, or names none.

        **The retry is safe in both cases**: nothing was sent, and no outbox row
        was written, so nothing claims a delivery that did not happen. A failed
        request also *releases* its `Idempotency-Key` rather than storing the
        failure, so retrying with the same key is not locked out for 24 hours.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://errors.cafaye.com/unavailable
            title: Service unavailable
            status: 503
            detail: >-
              The mail provider did not accept the message. Nothing was sent and
              nothing was recorded, so this request is safe to retry with the same
              Idempotency-Key.
            code: unavailable
            trace_id: 0af7651916cd43dd8448eb211c80319c

    ValidationFailed:
      description: |
        The request was well-formed and the thing it asked for is not allowed.
        `errors[].code` distinguishes a typo from a refused destination.

        On `sendMessage` this is also where a **declined preference** is answered,
        with `errors[0].code` `notification_preferences_disabled` and
        `errors[0].field` `type`. That is the opposite status from a suppressed
        mailbox, and deliberately so: a decline is visible through
        `GET /v1/notification_preferences/{user_id}` and changeable through the
        `PUT` beside it, so telling the caller to change something is the accurate
        answer — and `errors[]`, which core reserves for 422 and nothing else, is
        where a client can read that without parsing prose.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://errors.cafaye.com/validation_failed
            title: Validation failed
            status: 422
            detail: That url is one courier will not send webhooks to.
            code: validation_failed
            trace_id: 0af7651916cd43dd8448eb211c80319c
            errors:
              - field: url
                code: blocked_address
