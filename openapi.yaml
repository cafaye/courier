# courier's HTTP surface, per cafaye/core/docs/openapi-conventions.md.
#
# This file now describes every route courier's router serves except two, and the
# two are named here: `/healthz` and `/readyz` are infrastructure probes that run
# before auth, routing and the rest of the platform exist, and no customer codes
# against them. A document that claims to describe courier and quietly omits part
# of it is worse than one that says what it covers — which is why the omissions
# are declared in this header *and* enforced by
# `test/courier_web/openapi_document_test.exs`, which fails if this file and
# `lib/courier_web/router.ex` disagree in either direction.
#
# `GET` and `PUT /v1/notification_preferences/{user_id}` were in the router with
# tests behind them and absent from here, which is the drift this file's check now
# prevents from recurring. They are the other half of the public surface, not an
# afterthought, and they are documented as thoroughly as the webhooks.
#
# > DECISION NEEDED (courier-05): the two notification-preferences operations are
# > served **unauthenticated**, and this document says so with `security: []`
# > rather than claiming a scheme courier does not enforce. `router.ex` puts them
# > in the `:api` pipeline only, and the gap is recorded in
# > `CourierWeb.NotificationPreferencesController`'s moduledoc and pinned by
# > `test/courier_web/router_test.exs`. Core's conventions ask for required
# > scopes on every operation, so either courier authenticates them or the
# > convention needs an exception for per-user settings whose tenant is in the
# > path. Recommendation: authenticate them in a later packet, before a customer
# > integrates against this document — a generated client built from `security:
# > []` will send no token, so closing it later is a breaking change to the
# > contract. Cost of flipping now: one scope name and the plug in a scope block.
# > Cost of flipping later: a major `info.version` and every generated client.
#
# ## What courier does not return, and why that is written down here
#
# A document that omits a reachable response is worse than one that says what it
# covers, so the omissions are declared rather than left to be found. Each of the
# following was measured against this repository's endpoint rather than read off
# it, and each is the reason no operation below declares it:
#
#   * **403 `forbidden`** — nothing sends it. `CourierWeb.Plugs.Principal`
#     answers 401 for an anonymous caller and nothing else, and an endpoint in
#     another account is a 404, because core forbids a 403 that leaks existence.
#   * **409 `conflict` / `idempotency_key_reused`** — nothing sends them. A
#     duplicate `url` is a **422** whose `errors[0].code` is `taken`, which is the
#     status convention's "semantically wrong", not a conflict.
#   * **415 `unsupported_media_type`** — the parser is configured
#     `pass: ["*/*"]`, so an unknown content type is neither parsed nor refused.
#     The request reaches the controller and is answered 422 for the field it did
#     not carry.
#   * **429 `rate_limited`** — there is no limiter. Thirty rapid reads answer
#     thirty 200s and thirty rapid writes answer thirty 201s.
#   * **503 `unavailable`** — only `GET /readyz` sends it, and that is an
#     infrastructure probe rather than a customer operation.
#
# ## Idempotency-Key is not accepted, and this document does not pretend it is
#
# Core's conventions require `Idempotency-Key` on a mutating `POST` that can be
# retried safely, and `createWebhookEndpoint` is exactly that: it registers a
# destination that will receive at-least-once deliveries. **courier does not
# implement it.** Measured: the same key sent three times with the same body
# creates two rows and answers `201`, `422`, `422` — the 422s are the unique index
# on `url`, not the key — the same key with a different body creates a further
# row, and there is no `Idempotency-Replayed` response header. A non-uuid key and
# a 5000-character key are both accepted without complaint.
#
# So no operation below declares the header, and none declares a 409 courier
# cannot return. Declaring either would be a contract for behaviour that is not
# there, and a client that generated a retry from it would be retrying against a
# service that was never listening. It is named as a gap rather than papered
# over — REPORT-courier-12-contract.md has the measurement.
#
# ## Two other facts about this surface, because a reader is owed them
#
#   * **`?order=` and `?offset=` are accepted and ignored.** Core's standard
#     request shape is `?limit=&cursor=&order=asc|desc`; courier paginates
#     oldest-first only, so a request carrying `order` is answered as if it were
#     not there, and `offset` is ignored for the reason core gives for banning it.
#     Neither is declared below, because neither is honoured.
#   * **`limit` is capped silently.** `?limit=99999` is a 200 answering with at
#     most 100 rows, not a 422. The cap is real and is stated in the parameter;
#     what a client cannot see from here is that it was applied.
#
# ## Why `400` is on some operations and not others
#
# `CourierWeb.Plugs.ParseBody` wraps `Plug.Parsers`, and that reads a request body
# for `POST`, `PUT`, `PATCH` and `DELETE` — and for no other verb. So the 400 is
# reachable on exactly the four operations above that carry one of those verbs,
# which is not the same as "every operation that takes input": `GET` sends no body
# and is refused by neither the parser nor anything else, and a `400` declared on a
# `GET` is a case a client writes and can never run.
#
# `DELETE` is the one that reads wrong. A `DELETE` carries no body in any sensible
# client, so it looks bodyless, and a document that omits its 400 looks right —
# until a client that does send one is answered with a body nobody documented. It
# is declared for that reason, and
# `test/courier_web/openapi_error_responses_test.exs` checks the agreement in both
# directions so neither half can drift back.
openapi: 3.1.0

info:
  # The document's own semantic version, which moves with the document and not
  # with the `/v1` prefix. The prefix changes only on a breaking change, and then
  # this number changes in the same commit.
  #
  # This is a minor bump and nothing more. No path changed, no operation was added
  # or removed, and no request or response that already existed changed shape:
  # courier-12 added the two error responses every operation could already return
  # and described none of (`500` and `406`), and declared the `detail` courier
  # already sends inside a 422's `errors[]`. Core's sync rule is that a
  # non-breaking change bumps only `info.version`, and a client that already reads
  # this file is not broken by learning that a 500 was possible.
  version: 1.3.0
  title: caFaye courier
  description: |
    Transactional email, notification preferences, and outbound webhooks.

    courier delivers events to customer HTTP endpoints using the
    [Standard Webhooks](https://www.standardwebhooks.com) signature scheme, so a
    delivery is verified with an official library and nothing has to be written
    about courier's scheme.
  contact:
    name: courier
    email: courier@cafaye.com
  license:
    name: AGPL-3.0
    identifier: AGPL-3.0-only

servers:
  - url: https://courier.cafaye.com
    description: production
  - url: http://localhost:4000
    description: local

tags:
  - name: webhook endpoints
    description: |
      Where an account registers the URLs courier delivers events to, and the
      signing secrets those deliveries are signed with.
  - name: notification preferences
    description: |
      What a user has been asked to receive, per notification type and per channel.
      Silence is not consent: a user courier has never seen, or a type a user has
      never mentioned, is on.

security:
  - bearerAuth: []

paths:
  /v1/notification_preferences/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'

    get:
      tags: [notification preferences]
      operationId: getNotificationPreferences
      summary: What this user has been asked to receive
      description: |
        Every notification type courier sends, with this user's stored answers
        filled in and the defaults used where there are none. A `GET` never writes.

        **An unknown user is a 200, not a 404.** identity owns the user table.
        courier is asked about a user id and answers with that user's
        preferences, which for a user who has never touched the settings is
        three types, all on. A 404 would be courier claiming to know something
        about the requester it does not know.

        Served without authentication — see this document's header, which records
        the gap and why it is not quietly written over here.
      security: []
      responses:
        '200':
          description: Every notification type, with this user's answers
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/NotificationPreferences' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/Internal' }

    put:
      tags: [notification preferences]
      operationId: updateNotificationPreferences
      summary: Apply a batch of preferences
      description: |
        Stores a batch and answers with the state the user now has — the same
        shape a `GET` returns, so a settings page does not have to follow a write
        with a read to render.

        **A rejected batch writes nothing.** The entries are validated together
        before any of them is stored, so a typo in the third entry cannot leave
        the first two applied and the user looking at a half-saved settings page.
        Applying the same batch twice is the same answer: this operation is
        idempotent by construction, because it stores the state it is given rather
        than accumulating deltas.

        `user_id` comes from the path and is never read from the body. A body
        that names a different user cannot write that user's preferences.

        Served without authentication — see this document's header.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferences]
              properties:
                preferences:
                  type: array
                  minItems: 1
                  description: |
                    The entries to store. A type or channel not named here is left
                    alone, so a client that knows about one setting can send one
                    entry without overwriting the rest.
                  items:
                    type: object
                    required: [notification_type]
                    properties:
                      notification_type:
                        $ref: '#/components/schemas/NotificationType'
                      email_enabled:
                        type: boolean
                        default: true
                      push_enabled:
                        type: boolean
                        default: true
                        description: |
                          Stored and returned because the API is the user's
                          settings, but nothing sends push, so a `true` here does
                          not mean courier will send a push.
            examples:
              - preferences:
                  - notification_type: welcome
                    email_enabled: false
      responses:
        '200':
          description: The stored state, the same shape a `GET` returns
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/NotificationPreferences' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/Internal' }

  /v1/webhook_endpoints:
    get:
      tags: [webhook endpoints]
      operationId: listWebhookEndpoints
      summary: List the caller's webhook endpoints
      description: |
        Cursor-paginated, oldest first. Disabled endpoints are included:
        disabling is not deleting, and the row carries the failure count and the
        reason delivery stopped.
      security:
        - bearerAuth: [webhooks:read]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of endpoints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/Internal' }

    post:
      tags: [webhook endpoints]
      operationId: createWebhookEndpoint
      summary: Register a webhook endpoint
      description: |
        The signing secret is returned **once**, in this response, and cannot be
        retrieved afterwards. Store it before leaving the response. A url courier
        will not send to is refused with a 422 whose `errors[0].code` names the
        class — `blocked_scheme`, `blocked_host`, `blocked_address`,
        `dns_failure` — because a well-formed url that resolves to a private
        address is a different problem from a typo and the customer needs to be
        told which one they have.
      security:
        - bearerAuth: [webhooks:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 2048
                  description: |
                    An absolute http(s) URL. `file:`, `ftp:`, `gopher:`, `data:`
                    and `javascript:` are refused, as are loopback, link-local
                    (including `169.254.169.254`), RFC1918 and unique-local
                    addresses — by literal address *and* by what the host
                    resolves to.
                  examples:
                    - https://hooks.example.com/cafaye
                description:
                  type: string
                  maxLength: 500
                  nullable: true
      responses:
        '201':
          description: Registered, with the signing secret
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/WebhookEndpoint'
                      - type: object
                        required: [secret]
                        properties:
                          secret:
                            type: string
                            pattern: '^whsec_[A-Za-z0-9+/]+=*$'
                            description: |
                              The Standard Webhooks signing secret, base64
                              encoded behind the `whsec_` prefix. Shown once.
                            examples: ['whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw']
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/Internal' }

  /v1/webhook_endpoints/{id}:
    parameters:
      - $ref: '#/components/parameters/EndpointId'

    get:
      tags: [webhook endpoints]
      operationId: getWebhookEndpoint
      summary: Fetch one webhook endpoint
      security:
        - bearerAuth: [webhooks:read]
      responses:
        '200':
          description: The endpoint
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/WebhookEndpoint' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '500': { $ref: '#/components/responses/Internal' }

    patch:
      tags: [webhook endpoints]
      operationId: updateWebhookEndpoint
      summary: Change a webhook endpoint
      description: |
        A new `url` is a new destination and passes the same checks as a create.
        Fields that are not named are left alone, and the signing secret never
        changes here: a customer who edits a description must not have every
        delivery start failing verification for a day.
      security:
        - bearerAuth: [webhooks:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 2048
                description:
                  type: string
                  maxLength: 500
                  nullable: true
                status:
                  $ref: '#/components/schemas/WebhookEndpointStatus'
      responses:
        '200':
          description: The endpoint as it now is
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/WebhookEndpoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/Internal' }

    delete:
      tags: [webhook endpoints]
      operationId: deleteWebhookEndpoint
      summary: Remove a webhook endpoint
      security:
        - bearerAuth: [webhooks:write]
      responses:
        '204':
          description: Removed. No body.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '500': { $ref: '#/components/responses/Internal' }

  /v1/webhook_endpoints/{id}/test:
    parameters:
      - $ref: '#/components/parameters/EndpointId'

    post:
      tags: [webhook endpoints]
      operationId: testWebhookEndpoint
      summary: Send a signed test payload to the endpoint
      description: |
        Sends a signed `ping` and reports what the receiver answered. The response
        is `200` whether or not the endpoint accepted it: the caller's request
        was well-formed and courier did what it was asked, which is a different
        fact from courier being unable to test. Read `data.delivered`.

        This is not a delivery. It writes no `webhook_deliveries` row, counts no
        attempt, and does not move the endpoint's circuit breaker — a customer
        testing their own endpoint and getting a 500 has learned something true,
        and charging their circuit for asking would punish them for using the
        diagnostic.
      security:
        - bearerAuth: [webhooks:write]
      responses:
        '200':
          description: The ping was sent; `delivered` says whether it was accepted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [delivered, status_code, duration_ms]
                    properties:
                      delivered:
                        type: boolean
                        description: Whether the receiver answered 2xx.
                      status_code:
                        type: integer
                        nullable: true
                        description: The receiver's status, or null if nothing answered.
                      duration_ms:
                        type: integer
                        description: How long the attempt took.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '500': { $ref: '#/components/responses/Internal' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        identity is the only issuer. The token carries `account_id` for tenancy
        and `scopes` for capability; courier checks both and never reads a role
        out of a claim, because core's conventions say a service asks identity
        about roles and checks scopes itself.

  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      description: |
        A uuid from identity. courier does not own users and holds no foreign key
        to them, so this is checked for *shape* and nothing else: a non-uuid is a
        422 before the body is looked at, and a well-formed id courier has never
        seen is a 200 with the defaults.
      schema: { type: string, format: uuid }

    EndpointId:
      name: id
      in: path
      required: true
      description: The endpoint's uuid.
      schema: { type: string, format: uuid }

    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Defaults to 25, capped at 100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        The opaque cursor from a previous page's `page.next_cursor`. Clients must
        not parse it; courier's encoding may change without notice. A cursor
        courier did not issue is a 422.
      schema: { type: string }

  schemas:
    NotificationType:
      type: string
      enum: [welcome, password_reset, team_invitation]
      description: |
        Every notification type courier sends. A type outside this list is a 422
        naming `preferences[0].notification_type`, because a preference for
        something courier will never send is a setting page that lies to the user.

    NotificationPreference:
      type: object
      required: [notification_type, email_enabled, push_enabled]
      properties:
        notification_type: { $ref: '#/components/schemas/NotificationType' }
        email_enabled:
          type: boolean
          description: |
            Whether courier will send this type to this user by email. Defaults
            to true: silence is not consent.
        push_enabled:
          type: boolean
          description: |
            Stored and returned so the answer is complete, but nothing sends push
            — a `true` here does not mean courier will send a push.

    NotificationPreferences:
      type: object
      required: [user_id, preferences]
      properties:
        user_id:
          type: string
          format: uuid
          description: The user these preferences are for, as the path named them.
        preferences:
          type: array
          description: |
            Every notification type, always all of them and never a subset: a
            settings page should not have to guess what it has not been told.
          items: { $ref: '#/components/schemas/NotificationPreference' }

    WebhookEndpointStatus:
      type: string
      enum: [enabled, disabled]
      description: |
        `disabled` is two things wearing one column: the customer turned it off,
        or courier's circuit breaker tripped. `disabled_reason` tells them apart,
        and is courier's to clear.

    WebhookEndpoint:
      type: object
      required: [id, account_id, url, status, consecutive_failures]
      properties:
        id: { type: string, format: uuid }
        account_id:
          type: string
          format: uuid
          description: The owning account. Always the caller's.
        url: { type: string, format: uri, maxLength: 2048 }
        description: { type: string, nullable: true, maxLength: 500 }
        status: { $ref: '#/components/schemas/WebhookEndpointStatus' }
        consecutive_failures:
          type: integer
          description: |
            Failures since the last success. At the circuit threshold courier
            disables the endpoint and records why.
        disabled_reason:
          type: string
          nullable: true
          description: |
            Why delivery stopped, when courier is the one who stopped it. Null for
            an endpoint the customer disabled, and null again once they re-enable
            one courier had tripped.

    WebhookEndpointPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/WebhookEndpoint' }
        page:
          type: object
          required: [has_more, next_cursor]
          properties:
            has_more: { type: boolean }
            next_cursor:
              type: string
              nullable: true
              description: Null on the last page.

    Problem:
      type: object
      description: RFC 9457, with courier's extensions. Every non-2xx.
      required: [type, title, status, detail, code, trace_id]
      properties:
        type:
          type: string
          format: uri
          description: '`https://errors.cafaye.com/<code>`. The machine-readable contract.'
        title: { type: string }
        status: { type: integer }
        detail:
          type: string
          description: Specific to this occurrence. Not parsed by clients.
        instance:
          type: string
          nullable: true
          description: The path the request was made to.
        code:
          type: string
          description: The last segment of `type`, in snake_case.
        trace_id:
          type: string
          description: Matches the `X-Trace-Id` response header. Support starts here.
        errors:
          type: array
          description: Present only on a 422.
          items:
            type: object
            required: [field, code]
            properties:
              field:
                type: string
                description: The path in the *request*, which is what the caller can fix.
              code:
                type: string
                enum: [invalid_format, taken, blocked_scheme, blocked_host, blocked_address, dns_failure]
              detail:
                type: string
                description: |
                  Why this one field was refused, when courier has something to add
                  to `code` — a bad `limit` reads "is not a positive integer"
                  rather than only `invalid_format`. Present on some entries and
                  not on others, so a client must not require it.

  responses:
    BadRequest:
      description: |
        The body was not the shape courier was sent. This is 400 and not 422
        because a client could not have known: the request never parsed, so
        there is no field to name and nothing to correct.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://errors.cafaye.com/bad_request
            title: Bad request
            status: 400
            detail: The request body was not valid JSON.
            code: bad_request
            trace_id: 0af7651916cd43dd8448eb211c80319c

    NotAcceptable:
      description: |
        The request's `Accept` header does not include `application/json`, so
        Phoenix's `:accepts` plug refused to route it. This is the client naming a
        media type courier cannot answer, and courier says so with
        `not_acceptable` rather than with `internal`: an earlier version of courier
        fell through to the `:internal` default here and reported a client that had
        asked for `text/html` as courier having failed, which is the one code every
        generated client retries. Reachable on every operation in this document.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://errors.cafaye.com/not_acceptable
            title: Not acceptable
            status: 406
            detail: courier answers application/json.
            code: not_acceptable
            trace_id: 0af7651916cd43dd8448eb211c80319c

    Unauthorized:
      description: |
        No authenticated caller. courier does not guess an account for an
        anonymous request.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://errors.cafaye.com/unauthorized
            title: Unauthorized
            status: 401
            detail: This request needs an authenticated caller.
            code: unauthorized
            trace_id: 0af7651916cd43dd8448eb211c80319c

    NotFound:
      description: |
        No such endpoint, for this account. An endpoint belonging to another
        account is also a 404: core's conventions forbid a 403 here, because it
        leaks the existence of a resource the caller cannot see.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://errors.cafaye.com/not_found
            title: Not found
            status: 404
            detail: No webhook endpoint with that id.
            code: not_found
            trace_id: 0af7651916cd43dd8448eb211c80319c

    Internal:
      description: |
        courier failed and the client did nothing wrong. **Every operation in this
        document can answer this one**: it is what `Phoenix.Endpoint.RenderErrors`
        renders for any unhandled raise, including a database that has stopped
        answering. The envelope is courier's and carries the request's
        `trace_id`; the cause is in courier's logs under that id and is not
        repeated to the caller, because these bodies are read by anyone who can
        reach the service.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://errors.cafaye.com/internal
            title: Internal server error
            status: 500
            detail: The request could not be completed.
            code: internal
            trace_id: 0af7651916cd43dd8448eb211c80319c

    ValidationFailed:
      description: |
        The request was well-formed and the thing it asked for is not allowed.
        `errors[].code` distinguishes a typo from a refused destination.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://errors.cafaye.com/validation_failed
            title: Validation failed
            status: 422
            detail: That url is one courier will not send webhooks to.
            code: validation_failed
            trace_id: 0af7651916cd43dd8448eb211c80319c
            errors:
              - field: url
                code: blocked_address
