# gate.yml — how courier is gated, declared rather than guessed.
#
# WHY THIS FILE EXISTS. The cafaye standard for declaring a gate lives in
# `cafaye/core`: `schemas/gate.schema.json` is the format, `harness/gate_check.py`
# is the checker, and `docs/gate.md` is the reasoning (including the two
# alternatives that were measured and rejected). courier is adopting it, not
# inventing it. The short version of why: across fifteen repositories "run the
# gate" had five spellings, and every one of them was found by a human getting
# it wrong. A gate that is discovered by failure is a gate that was never
# declared.
#
# WHAT THE CHECKER PROVES ABOUT THIS FILE, AND WHAT IT DOES NOT. It proves the
# command resolves, `bin/prime` exists and is executable, `mise run prime`
# resolves to that same file, the CI workflow really invokes it, and — the part
# that matters — that running the gate makes the suite's own summary line
# appear, at or above the floor below. It does NOT prove the tests touched
# anything they claim to, and it does not prove a requirement is satisfied: a
# requirement is the operator's to satisfy, before gating.
#
# MEASURED, NOT GUESSED. Every number and every pattern here came from running
# this repository's gate and reading its output. The figures below are courier at
# master 59247b6, except the suite count, which the observability packet
# re-measured on `worker/sell-observability` after adding the redaction tests:
#
#   * the gate is `mise run prime`, which runs `./bin/prime`;
#   * the suite prints exactly one `Result:` line, `Result: 678 passed`;
#   * a warm gate takes ~37s; a cold one (deps + compile) is minutes;
#   * `./bin/prime` on its own does NOT work without mise on PATH — line 14 is
#     `mix local.hex --force` and it exits 127 with "mix: command not found".
#     That is why `command` names mise and not the script.
version: 1
name: courier

gate:
  # The command a person or a tool runs, as an argv and never a shell string, so
  # the exit code is the gate's own. This fleet's one recorded false green was
  # `… | tail -45; echo "PRIME EXIT=$?"` under zsh, where `$?` is tail's.
  #
  # mise and not `bin/prime`, and that is a measured claim rather than a taste.
  # bin/prime's first act is `mix local.hex --force`; run with a PATH that has no
  # mise shims it dies at line 14 with "mix: command not found" and the gate
  # never runs a test. Declaring `[bin/prime]` would be declaring a command that
  # only works inside a shell somebody has already set up — which is the same
  # class of defect as a `run` string naming a file that does not exist.
  command: [mise, run, prime]
  # The fleet's spelling, and the task a developer is told to run in AGENTS.md
  # and in mise.toml's own header. Checked against mise.toml: its `run` string
  # has to resolve to `entrypoint` below, so the task and this file cannot drift
  # apart into two different gates.
  miseTask: prime
  # The file behind the command, and the file the mise task resolves to.
  entrypoint: bin/prime
  # Deliberately generous. A warm gate measured ~37s wall clock (deps already
  # fetched, compiled, database already migrated). A cold checkout has to fetch
  # 60+ hex packages, compile them, create and migrate the database, and then
  # run the suite: minutes. A floor tight enough to be a bug detector here is
  # tight enough to be a flake generator on somebody's first run, and a timeout
  # that fires on a cold clone is a gate that reports a red that is not the
  # suite's answer. The suite's own budget is the thing to tune here, not this.
  timeoutSeconds: 1800
  proof:
    # The one line that cannot appear unless ExUnit ran to the end of the suite.
    # It is a proof rather than a convention because `gate.proof-missing` is a
    # FAILURE: a gate that exits zero having run nothing is a red, not a green.
    # This is the defect the format exists to catch — cafaye-rb's database tier
    # never executed once and the run printed `ok`.
    - id: suite
      # Measured from eight real runs. The shape is anchored at both ends on
      # purpose: ExUnit's other shapes are `Result: 0 tests` (nothing ran) and
      # `Result: P/T passed` (a failure), and a fractional line must NOT satisfy
      # this proof. `$` with a re.MULTILINE compile is what makes that true —
      # verified against a real failing run, where this pattern matches nothing
      # and the red run is caught by the exit code instead.
      #
      # A ` (...)` test-type breakdown is tolerated for the same reason
      # `bin/assert-suite` tolerates it: the 1.20 formatter appends one when
      # test types differ, and today courier has none. The group is
      # NON-CAPTURING — `(?: … )` — and that is load-bearing, not a style
      # choice: `minimum` is read from the pattern's SINGLE capture group, so a
      # second capturing group is `gate.proof-invalid`. The first draft of this
      # file wrote `( … )` by mistake and the checker refused it with exactly
      # that finding, which is the check working on the declaration that
      # declares the checks.
      match: '^Result: ([0-9]+) passed(?: \([^)]*\))?$'
      # 672 is what the suite reports today minus the small deliberate margin,
      # measured, not copied from core's 163 or from courier's own CI floor. This
      # is a DECREASE-DETECTOR: `minimum` is read from the LAST match, so a run
      # that printed 678 and then 560 would be caught, and a suite that quietly
      # lost 118 tests cannot report itself as passing.
      #
      # The margin below the measured 678 is deliberate and small. courier is a
      # growing repository and this floor is a ratchet that is meant to be
      # raised as the suite grows, not a target the suite must hit.
      #
      # Remeasured on the tree carrying `Courier.Inbound`: 1027 whole-suite tests,
      # so 1021 with the same deliberate margin of 6 that 672 held against a
      # measured 678, 722 against 728, 816 against 822, and 912 against 918.
      # Neither incoming number described this tree — a floor is a claim about the
      # tree it lives in, so it is measured on the tree it lives in.
      #
      # 1027 measured with `./bin/prime` on this branch, and it is the sum of the
      # two CI tiers measured the same way in the same run: 489 with no database
      # and 538 with one. The +109 over the previous 918 is this packet's inbound
      # tests, and **both tiers moved**, which is what distinguishes a floor
      # measured on this tree from one copied forward. The `no database` tier grew
      # because signature verification is arithmetic over bytes and parsing is JSON
      # to a map — neither touches a repo, so the security-critical assertions
      # about the SCHEME run with no database at all. The `database` tier grew
      # because the security property is a claim about rows, and
      # `test/courier/inbound_test.exs` is a `Courier.DataCase` for that reason
      # alone: "an unsigned payload records nothing" is unassertable against a
      # mock.
      #
      # The previous value here was 918 against a measured 918+6, remeasured on the
      # MERGED tree after the send-surface packet. The value before that was 816
      # against a measured 630, raised by the observability packet in the same
      # commit that added its 62 tests. The value before that was 610 against a
      # measured 616, raised by courier-16 in the same commit that closed the
      # notification-preferences authentication gap and added its 14 tests. The
      # value before that was 560 against a measured 564, raised by courier-14 in
      # the same commit that added the 52 `Idempotency-Key` tests. Every one of
      # those is this rule: the floor moves in the same commit that changes what
      # courier verifies.
      minimum: 1021

external:
  # NOT self-contained, and saying so is the point. The gate needs a postgres
  # nobody in this repository carries, a toolchain this repository pins rather
  # than ships, and a hex fetch on a cold checkout. A declaration that called
  # this self-contained would be describing a gate nobody has ever run on a
  # clean machine — the same defect as identity's gate being green over a
  # database nobody had migrated, told the other way round.
  # The reasoning for each requirement is in the comment above it. The `name`
  # field is capped at 200 characters by the schema, and that cap is the format
  # telling me something true: this field is a NAME a reader can check against,
  # not an essay. The first draft of this file put the whole argument in `name`
  # and the checker refused it with `gate.schema` — which is the schema working.
  selfContained: false
  requirements:
    - kind: database
      # WHY THIS IS A REQUIREMENT AND NOT A DETAIL. `mix ecto.setup` creates AND
      # migrates courier_test, and `mix test` is aliased to `ecto.create` plus
      # `ecto.migrate` — so unlike identity, this repository cannot quietly run
      # its whole suite against an empty schema. That is a property of the
      # repository, and it is a reason to be relieved, not a reason to pretend
      # the database is not needed. Without a migrated postgres the gate still
      # cannot run at all.
      #
      # AND WHAT SATISFIES IT CHANGED, which is why this block was rewritten
      # rather than left alone. It used to say `docker compose up -d db`, and that
      # command named a service courier no longer has: this repository adopted
      # kit's stack, and a service that adopts kit's stack owns no container of
      # its own. A `satisfy` command that no longer runs is worse than a missing
      # one — it is a gate declaration that reports a satisfied operator while
      # describing a repository that does not exist.
      #
      # The host-side suite and the dev container are therefore on DIFFERENT
      # databases, and the reason is a compose fact rather than a preference.
      # `ports:` is a LIST, and a second file's list is APPENDED rather than
      # substituted — so courier publishing its own port on kit's postgres gives
      # you postgres on kit's port AND on courier's, and kit's
      # `tests/fleet_check.py` fails exactly that. The dev container reaches
      # courier's database over the compose network by service name, where no port
      # is involved; the host-side suite needs a postgres on 5432 that is courier's
      # to publish, and it no longer is.
      name: >-
        PostgreSQL at localhost:5432 as postgres/postgres, the credentials
        config/test.exs hard-codes. Satisfied by any local postgres on that
        address; the gate measured against a native PostgreSQL 18.4.
      satisfy:
        # A REPOSITORY-RELATIVE FILE, so the checker verifies it is there — and
        # here it also RUNS nothing, because it is a file, which is the point: a
        # `satisfy` command that this checker executes would start a database
        # every time somebody validated a gate declaration.
        #
        # It is `bin/gate-db` rather than a bare `docker run` argv because the argv
        # needs `POSTGRES_PASSWORD=postgres`, and an argv item carrying `=` is a
        # shell string wearing an argv's clothes — which core's checker refuses, and
        # rightly. A script is also where the port-collision explanation belongs.
        #
        # Deliberately NOT `bin/dev`: it brings up kit's stack, whose postgres is
        # published on `${KIT_POSTGRES_PORT:-15500}` under kit's own credentials,
        # and pointing courier's suite at it would mean the gate ran against a
        # container the dev loop also mutates.
        command: [bin/gate-db]
        unmet: >-
          mix ecto.setup exits nonzero with a Postgrex/ConnectionError, or the
          run ends with no `Result:` line at all because `mix test` never started
    - kind: toolchain
      # WHY THIS IS MEASURED RATHER THAN ASSUMED. See the note on `command`
      # above: bin/prime under a PATH with no mise shims exits 127 at line 14
      # with "mix: command not found". The requirement is not "a compiler
      # exists" — it is specifically the two versions mise.toml pins.
      name: >-
        mise, plus the Elixir 1.20.4 and Erlang 29.1.1 pinned in mise.toml.
        Without the pins there is no `mix` on PATH and bin/prime dies at line
        14 before running a test.
      satisfy:
        # A bare name, so this is a claim about the machine and the checker
        # reports it as unproven rather than guessing. `mise install` is the
        # command mise's own header in this repository's mise.toml names.
        command: [mise, install]
        unmet: >-
          bin/prime exits 127 at line 14 with "mix: command not found" in the
          message
    - kind: network
      # WHY "ONCE, ON A COLD CHECKOUT" AND NOT ALWAYS. deps/ and _build/ are
      # gitignored and populated after the first run, and a warm gate was
      # measured with the network untouched — the fetch is genuinely a
      # cold-checkout cost and saying "network" flatly would over-claim a
      # requirement this gate does not always have.
      name: >-
        hex.pm, ONCE, on a cold checkout only — `mix local.hex --force` and
        `mix deps.get` fetch 60+ packages. A warm gate needs no network.
      satisfy:
        # A bare name for the same reason as the other two. `mix deps.get` is
        # the command that performs the fetch; it needs mise's environment, so
        # the honest spelling is the one mise runs. Verified working from a
        # bare PATH.
        command: [mix, deps.get]
        unmet: >-
          mix local.hex --force or mix deps.get exits nonzero on a cold
          checkout with no network, and the suite never starts
  # NOT required, and named so nobody goes looking for them:
  #   * no credential. The one variable that looks like a secret,
  #     COURIER_SECRET_BOX_KEY, is required by config/runtime.exs in :prod only
  #     and fixed to a committed test-only value in config/test.exs. `mix test`
  #     never reads it from the environment — the gate needs no secret.
  #   * no service beyond the database above. Oban runs in :manual testing mode
  #     and the NATS publisher is the Noop stand-in, both configured in
  #     config/test.exs, so nothing dials out during the gate.
  #   * no filesystem path outside the repository. deps/ and _build/ are written
  #     inside the tree and are gitignored.

ci:
  # The workflow, and the argv it runs. Checked TEXTUALLY against the workflow's
  # `run:` bodies, so a workflow that stops calling the gate becomes
  # `gate.ci-disagrees` rather than a quiet divergence. courier's gate job runs
  # `./bin/prime` unmodified — the repository's own rule is that the CI gate is
  # the same command, not a CI variant of it — and every element of `invokes`
  # has to appear in one of those bodies.
  workflow: .github/workflows/ci.yml
  invokes: [bin/prime]
