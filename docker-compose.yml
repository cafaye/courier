# courier's own compose file — an OVERRIDE, not a copy.
#
#   bin/dev            # fetch the pinned kit stack, merge it with this file, up
#   docker compose -f <kit>/templates/compose/docker-compose.yml \
#                  -f ./docker-compose.yml up -d --wait
#
# THIS FILE OWNS THREE THINGS AND NOTHING ELSE
#
#   1. the `postgres` service's database name and role   (kit ships the container)
#   2. the `courier` service: its image, its port, its environment
#   3. the crash layer: where this container's stdout/stderr goes
#
# WHY THERE IS NO `postgres:` CONTAINER HERE ANY MORE, and it is the first thing a
# reader will look for. kit's stack already ships one, and a second copy is two
# postgres majors to upgrade and a port collision on the second developer on the
# machine. Pointing at kit's is an ENVIRONMENT override, which is the one kind
# compose merges correctly.
#
# WHAT THIS FILE MAY NOT DO, and the collector is the reason
#
#   It may not touch `otel-collector`. Not its image, not its command, and above
#   all not the `volumes:` entry that mounts `otel-collector.yml`. That file
#   carries the redaction allowlist, which kit DERIVES from core's schemas; a
#   service that owned it would be shipping a telemetry boundary nobody derived, and
#   prompt content would leave the process inside it. kit's tests/fleet_check.py
#   fails this repository over any of the three, and the moment `kit.ref` exists
#   below, that failure has no discretion left in it.
#
# WHY THERE IS NO `depends_on: otel-collector`, and it is load-bearing
#
#   Nothing but the collector may be in a readiness path. A service that waits for
#   the collector serves no traffic while the collector is down, which is strictly
#   worse than serving traffic with no traces — and it teaches people to switch
#   telemetry off, which is the opposite of what this packet is for. kit's gate
#   fails on a `depends_on` naming the collector, and its
#   tests/no_telemetry_in_readiness.sh proves the property against a real collector
#   by killing it and showing the service still serving.
#
#   The same rule is why the span exporter has no retry: a collector that is not up
#   yet is the normal state of a fresh `docker compose up`, and the service must not
#   care.

services:
  # kit ships the postgres container; this is the one thing about it that belongs to
  # this service. Overriding `environment:` merges per key, so kit's own POSTGRES_*
  # defaults survive for anything not named here.
  postgres:
    environment:
      POSTGRES_DB: courier
      POSTGRES_USER: courier
      POSTGRES_PASSWORD: courier

  courier:
    build:
      context: .
      dockerfile: Dockerfile
    image: cafaye/courier:dev
    # A literal, and NOT a `${KIT_*:default}` — this is courier's OWN port, not one
    # of kit's. kit's port block is a statement about the shared infrastructure, and
    # 4000 is what a Phoenix release defaults to and what courier's own documented
    # port is; moving it is a change to a published contract, not a compose edit.
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      # Over the compose network, by service name. The host mapping above is for the
      # developer and the host-side test suite.
      DATABASE_URL: ecto://courier:courier@postgres:5432/courier

      # ---------------------------------------------------------------------
      # OBSERVABILITY, ON BY DEFAULT
      #
      # One variable, and it is the only contract (core D16). Unset it and the
      # collector that ships with the stack is the default — that is the whole of
      # "a deployer gets traces without assembling them". Point it at any OTLP
      # endpoint and courier exports there instead.
      #
      # It is declared here, in the service's own file, rather than defaulted in the
      # Elixir code alone, so a reader of this file can see where telemetry goes
      # without reading the source. `Courier.Telemetry.endpoint/0` has the same
      # default, and `test/courier/telemetry_test.exs` holds the two to one value.
      COURIER_OTEL_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_VERSION: "0.0.0-dev"

      # `tenant_id` goes on the RESOURCE, never on a measurement — see the collector
      # config's `transform/cafaye_resource_*` pair. Unset by default: a
      # single-tenant development stack has no tenant to name, and an empty one
      # would show up as a second service row in every collector's service list.
      # COURIER_TENANT_ID: ""
      #
      # `deployment.environment` is an ENUM in core's resource schema
      # (development/test/staging/production), so `local` is not one of the four.
      DEPLOYMENT_ENVIRONMENT: development

      # The key every webhook signing secret is sealed under. Required rather than
      # defaulted, because a default would be a key in version control and every
      # deployment that forgot one would seal its customers' credentials under it.
      # 32 bytes, base64:
      #
      #     openssl rand -base64 32
      COURIER_SECRET_BOX_KEY: "${COURIER_SECRET_BOX_KEY:?set COURIER_SECRET_BOX_KEY, or run: openssl rand -base64 32}"

    # THE CRASH LAYER, and it is the reason a panic reaches an operator with no
    # per-language log SDK in it.
    #
    # Every one of the six languages writes a fatal error to stderr; in a container
    # that is the log stream. Docker's `syslog` driver ships it over the compose
    # network to the collector's `syslog/crash` receiver, which makes a panic a log
    # record with a `service.name` on it and no per-language dependency at all.
    #
    # `syslog` rather than `filelog` on `/var/lib/docker/containers`, and that is a
    # portability decision with a history: the filelog form works on a Linux host and
    # does not work at all under Docker Desktop or OrbStack, where the daemon's
    # filesystem lives inside a VM the host cannot bind-mount without asking for a
    # shared directory. The syslog driver delivers the same bytes from the same
    # place on every platform.
    #
    # NO HOST PORT, and the receiver it talks to is not published either. A syslog
    # receiver on the host loopback is an unauthenticated log-injection point for
    # anything else on the machine.
    #
    # `tag` is the process identity the collector promotes to `service.name` when a
    # record has none — see `transform/cafaye_logs`. It has to match the service
    # name or a crash is filed against `unknown`.
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://otel-collector:15514"
        tag: "courier"

    # The database, and ONLY the database. Not the collector, for the reason at the
    # top of this file.
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # `/readyz`, over the container's own loopback. Readiness rather than
      # `/healthz` because readiness is the one that consults the database, and a
      # healthcheck that passes against a database that is gone is a healthcheck that
      # reports a working service that answers 503.
      #
      # No `curl` in the image, and no shell either — the release is distroless, so
      # a `CMD-SHELL` probe cannot run at all.
      test:
        - CMD
        - /app/bin/courier
        - eval
        - "IO.puts(:ok)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
